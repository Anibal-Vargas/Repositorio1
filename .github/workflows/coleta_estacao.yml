name: Coleta da estação meteorológica

on:
  schedule:
    # A cada hora, no minuto 0 (horário UTC; pode atrasar alguns minutos)
    - cron: "0 * * * *"
  # Permite disparar manualmente pela aba Actions, para testar
  workflow_dispatch:

# Necessário para o workflow commitar a planilha atualizada
permissions:
  contents: write

# Evita duas coletas simultâneas disputando o commit
concurrency:
  group: coleta-estacao

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install tuya-connector-python openpyxl

      - name: Coletar leituras da estação
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          # Timestamps no fuso do Brasil, não em UTC
          TZ: America/Sao_Paulo
        run: python estacao_tuya.py

      - name: Commitar a planilha atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estacao.xlsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "Coleta automática: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
